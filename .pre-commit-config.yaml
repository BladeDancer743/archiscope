repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix --no-cache
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format --no-cache
        language: system
        types: [python]
      - id: unit-tests
        name: unit tests
        entry: python -m unittest discover -s tests -v
        language: system
        pass_filenames: false
        stages: [pre-push]
