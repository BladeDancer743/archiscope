<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 480">
  <title id="title">Archiscope — architecture zoom lens for AI coding agents</title>
  <desc id="desc">A dark technical interface showing an architecture graph being inspected through a bright cyan focus lens.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="0.55" stop-color="#0b1425"/>
      <stop offset="1" stop-color="#11182d"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.52" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14213a" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0b1425" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.58"/>
    </filter>
  </defs>

  <rect width="1200" height="480" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="480" rx="28" fill="url(#grid)"/>
  <path d="M0 405C230 336 404 451 632 395S1002 315 1200 374V480H0Z" fill="#38bdf8" opacity="0.035"/>

  <g transform="translate(72 66)">
    <rect width="196" height="28" rx="14" fill="#132238" stroke="#334155"/>
    <circle cx="17" cy="14" r="4" fill="#5eead4"/>
    <text x="31" y="19" fill="#a7f3d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">OPEN SOURCE · PYTHON</text>

    <text x="0" y="106" fill="url(#brand)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="-2">ARCHISCOPE</text>
    <text x="2" y="148" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="650">Architecture that answers back.</text>
    <text x="2" y="182" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Zoom into any module. See the real data flow.</text>
    <text x="2" y="208" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Stay inside your AI coding conversation.</text>

    <g transform="translate(0 246)" font-family="Inter,Segoe UI,Arial,sans-serif">
      <g>
        <rect width="132" height="42" rx="12" fill="#0f1d32" stroke="#2dd4bf" stroke-opacity="0.45"/>
        <text x="16" y="18" fill="#5eead4" font-size="10" font-weight="750" letter-spacing="1">VIEWS</text>
        <text x="83" y="29" fill="#f8fafc" font-size="24" font-weight="800">16</text>
      </g>
      <g transform="translate(146)">
        <rect width="154" height="42" rx="12" fill="#0f1d32" stroke="#38bdf8" stroke-opacity="0.45"/>
        <text x="16" y="18" fill="#7dd3fc" font-size="10" font-weight="750" letter-spacing="1">RULES</text>
        <text x="100" y="29" fill="#f8fafc" font-size="24" font-weight="800">25</text>
      </g>
      <g transform="translate(314)">
        <rect width="168" height="42" rx="12" fill="#0f1d32" stroke="#818cf8" stroke-opacity="0.45"/>
        <text x="16" y="18" fill="#a5b4fc" font-size="10" font-weight="750" letter-spacing="1">AI AGENTS</text>
        <text x="126" y="29" fill="#f8fafc" font-size="24" font-weight="800">5</text>
      </g>
    </g>
  </g>

  <g transform="translate(654 56)" filter="url(#soft)">
    <rect width="478" height="366" rx="20" fill="url(#panel)" stroke="#334155"/>
    <rect x="1" y="1" width="476" height="44" rx="19" fill="#17243a"/>
    <circle cx="22" cy="23" r="5" fill="#fb7185"/>
    <circle cx="40" cy="23" r="5" fill="#fbbf24"/>
    <circle cx="58" cy="23" r="5" fill="#34d399"/>
    <text x="82" y="28" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">archiscope / demo.pipeline</text>

    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M88 126H180" stroke="#475569" stroke-width="2"/>
      <path d="M292 126H386" stroke="#475569" stroke-width="2"/>
      <path d="M236 178V238" stroke="#475569" stroke-width="2"/>
      <path d="M386 126l-9-6v12Z" fill="#64748b" stroke="none"/>
      <path d="M236 238l-6-9h12Z" fill="#64748b" stroke="none"/>
    </g>

    <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
      <g transform="translate(24 101)">
        <rect width="64" height="50" rx="9" fill="#111c2e" stroke="#475569"/>
        <text x="32" y="23" fill="#cbd5e1" font-size="10" font-weight="700">GATE</text>
        <text x="32" y="37" fill="#64748b" font-size="9">input</text>
      </g>
      <g transform="translate(180 92)">
        <rect width="112" height="68" rx="12" fill="#10253b" stroke="#38bdf8" stroke-width="2"/>
        <rect x="7" y="7" width="98" height="54" rx="8" fill="none" stroke="#5eead4" stroke-opacity="0.7"/>
        <text x="56" y="29" fill="#f8fafc" font-size="12" font-weight="800">PIPELINE</text>
        <text x="56" y="46" fill="#7dd3fc" font-size="9">focused module</text>
      </g>
      <g transform="translate(386 101)">
        <rect width="68" height="50" rx="9" fill="#111c2e" stroke="#475569"/>
        <text x="34" y="23" fill="#cbd5e1" font-size="10" font-weight="700">STORE</text>
        <text x="34" y="37" fill="#64748b" font-size="9">output</text>
      </g>
      <g transform="translate(194 238)">
        <rect width="84" height="50" rx="9" fill="#111c2e" stroke="#475569"/>
        <text x="42" y="23" fill="#cbd5e1" font-size="10" font-weight="700">RULES</text>
        <text x="42" y="37" fill="#64748b" font-size="9">validate</text>
      </g>
    </g>

    <circle cx="236" cy="126" r="82" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="14"/>
    <circle cx="236" cy="126" r="82" fill="none" stroke="url(#brand)" stroke-width="3" filter="url(#glow)"/>
    <path d="M294 184l47 47" stroke="url(#brand)" stroke-width="11" stroke-linecap="round" filter="url(#glow)"/>

    <g transform="translate(24 310)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
      <text x="0" y="0" fill="#5eead4" font-size="11">$</text>
      <text x="16" y="0" fill="#cbd5e1" font-size="11">archiscope render demo.pipeline</text>
      <text x="0" y="24" fill="#64748b" font-size="10">✓ scope resolved   ✓ geometry verified   ✓ rendered</text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="478.5" rx="27.25" fill="none" stroke="#334155" stroke-opacity="0.8" stroke-width="1.5"/>
</svg>
