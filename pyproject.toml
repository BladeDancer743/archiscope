[project]
name = "archiscope"
version = "0.6.0"
description = "Portable architecture zoom lens for AI coding agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "BladeDancer743" },
]
keywords = ["architecture", "ai-agents", "visualization", "mermaid", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "ruff>=0.9",
    "types-PyYAML>=6.0",
]

[project.scripts]
archiscope = "archiscope.cli:main"

[project.urls]
Homepage = "https://github.com/BladeDancer743/archiscope"
Repository = "https://github.com/BladeDancer743/archiscope.git"
Issues = "https://github.com/BladeDancer743/archiscope/issues"
Documentation = "https://github.com/BladeDancer743/archiscope/tree/master/docs"
Changelog = "https://github.com/BladeDancer743/archiscope/blob/master/CHANGELOG.md"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["archiscope*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
files = ["src/archiscope"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disable_error_code = ["var-annotated"]
